<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng ký - CellPC</title>
    <link href="css/bootstrap.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
    <link href="css/login.css" rel="stylesheet">
    <link href="css/register.css" rel="stylesheet">
</head>
<body>
    <header class="site-header">
        <div class="header-content">
            <img src="Img/logo.png" alt="CellPC" class="site-logo">
            <h1>CellPC - Chào mừng quý khách</h1>
        </div>
    </header>

    <div class="container">
        <nav class="navbar navbar-expand-sm text-bg-secondary justify-content-center">
            <ul class="navbar-nav">
                <li class="nav-item"><a class="nav-link text-light" href="index.html">Trang chủ</a></li>
                <li class="nav-item"><a class="nav-link text-light" href="trang tin tuc.html">Tin tuc</a></li>
                <li class="nav-item"><a class="nav-link text-light" href="product.html">Sản phẩm</a></li>
                <li class="nav-item"><a class="nav-link text-light" href="tranggioithieu.html">Giới thiệu</a></li>
                <li class="nav-item"><a class="nav-link text-light" href="giohang.html">Giỏ hàng</a></li>
                <li class="nav-item"><a class="nav-link text-light" href="trang lien he.html">Liên Hệ</a></li>
                <li class="nav-item"><a class="nav-link text-light fw-bold text-decoration-underline" href="trang dang nhap va dang xuat.html">Đăng nhập và Đăng xuất</a>
                </li>
            </ul>
        </nav>
    </div>
    <div class="container">
        <div class="my-3 khung-timkiem">
            <input type="text" id="oTimKiem" class="form-control" placeholder="tìm kiếm sản phẩm...">
        </div>
    </div>

    <main class="container register-wrapper">
        <section class="auth-card register-card">
            <h2 class="auth-title">ĐĂNG KÝ TÀI KHOẢN</h2>
            <p class="register-description">Vui lòng điền đầy đủ thông tin bên dưới.</p>

            <form action="#" method="post">
                <div class="row">
                    <div class="col-12 col-md-6 mb-3">
                        <label for="fullname" class="form-label">Họ và tên</label>
                        <input type="text" class="form-control" id="fullname" name="fullname"
                               placeholder="Nhập họ và tên" required>
                    </div>
                    <div class="col-12 col-md-6 mb-3">
                        <label for="username" class="form-label">Tên đăng nhập</label>
                        <input type="text" class="form-control" id="username" name="username"
                               placeholder="Tạo tên đăng nhập" required>
                    </div>
                    <div class="col-12 col-md-6 mb-3">
                        <label for="email" class="form-label">Email</label>
                        <input type="email" class="form-control" id="email" name="email"
                               placeholder="Nhập địa chỉ email" required>
                    </div>
                    <div class="col-12 col-md-6 mb-3">
                        <label for="phone" class="form-label">Số điện thoại</label>
                        <input type="tel" class="form-control" id="phone" name="phone"
                               placeholder="Nhập số điện thoại">
                    </div>
                    <div class="col-12 col-md-6 mb-3">
                        <label for="password" class="form-label">Mật khẩu</label>
                        <input type="password" class="form-control" id="password" name="password"
                               placeholder="Nhập mật khẩu" required>
                    </div>
                    <div class="col-12 col-md-6 mb-3">
                        <label for="confirmPassword" class="form-label">Nhập lại mật khẩu</label>
                        <input type="password" class="form-control" id="confirmPassword"
                               name="confirmPassword" placeholder="Nhập lại mật khẩu" required>
                    </div>
                </div>

                <div class="form-check mb-3">
                    <input class="form-check-input" type="checkbox" id="agree" name="agree" required>
                    <label class="form-check-label" for="agree">
                        Tôi đồng ý với các điều khoản sử dụng.
                    </label>
                </div>

                <button type="submit" class="btn btn-primary auth-button">Đăng ký</button>
                <p class="auth-note">Đã có tài khoản? <a href="trang dang nhap va dang xuat.html">Đăng nhập</a></p>
            </form>
        </section>
    </main>

    <footer class="site-footer">
        Bản quyền © CellPC - Đồ án môn học
    </footer>
</body>
</html>
